---
layout: default
---
<article class="page">
  <pre class="source-prompt" aria-hidden="true">$ cat {{ page.path }}</pre>
  <header class="page-header">
    <h1 class="page-title">{{ page.title }}</h1>
    {%- if page.subtitle -%}
      <p class="page-subtitle">{{ page.subtitle }}</p>
    {%- endif -%}
  </header>
  <div class="page-content">
    {{ content }}
  </div>
</article>
