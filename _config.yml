# Site
title: opensystems79
subtitle: Diarrhea of a Madman
description: >-
  opensystems79 — Diarrhea of a Madman. Persönliches Blog von Jens.
url: "https://opensystems79.de"
baseurl: ""
lang: de

author:
  name: Jens
  email: jhfvu783ubh@opensystems79.de

# Build
markdown: kramdown
highlighter: rouge
permalink: /:year/:month/:day/:title/
timezone: Europe/Berlin

# Posts in der Zukunft NICHT bauen — der tägliche Cron-Build zieht sie automatisch rein,
# sobald das Veröffentlichungsdatum erreicht ist.
future: false
unpublished: false

# Pagination (für spätere Erweiterung vorbereitet)
paginate: 20
paginate_path: "/page:num/"

# Kramdown
kramdown:
  input: GFM
  syntax_highlighter: rouge
  syntax_highlighter_opts:
    css_class: 'highlight'
    block:
      line_numbers: false

# Plugins
plugins:
  - jekyll-sitemap
  - jekyll-seo-tag
  - jekyll-paginate

# Sass
sass:
  style: compressed
  sass_dir: _sass

# Defaults
defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "post"
      author: "Jens"
  - scope:
      path: ""
      type: "pages"
    values:
      layout: "page"

# Exclude
exclude:
  - Gemfile
  - Gemfile.lock
  - vendor/
  - node_modules/
  - README.md
  - CLAUDE.md
  - scripts/
  - .github/
  - .ruby-version
  - LICENSE
  - LICENSE.md

# SEO
social:
  name: Jens
  links: []
