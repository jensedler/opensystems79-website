<meta charset="utf-8">
<meta http-equiv="X-UA-Compatible" content="IE=edge">
<meta name="viewport" content="width=device-width, initial-scale=1">

{%- assign page_title = page.title | default: site.title -%}
{%- if page.url == "/" -%}
  <title>{{ site.title }} — {{ site.subtitle }}</title>
{%- else -%}
  <title>{{ page_title }} — {{ site.title }}</title>
{%- endif -%}

<meta name="description" content="{{ page.description | default: site.description | strip_html | normalize_whitespace | truncate: 160 }}">
<meta name="author" content="{{ site.author.name }}">

<link rel="canonical" href="{{ page.url | absolute_url }}">
<link rel="alternate" type="application/rss+xml" title="{{ site.title }}" href="{{ '/feed.xml' | absolute_url }}">

<link rel="icon" type="image/svg+xml" href="{{ '/assets/img/favicon.svg' | relative_url }}">

<link rel="preload" href="{{ '/assets/fonts/JetBrainsMono-Regular.woff2' | relative_url }}" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="{{ '/assets/fonts/JetBrainsMono-Bold.woff2' | relative_url }}" as="font" type="font/woff2" crossorigin>

<link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}">

<script>
  (function() {
    try {
      var stored = localStorage.getItem('theme');
      var prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
      var theme = stored || (prefersDark ? 'dark' : 'light');
      document.documentElement.setAttribute('data-theme', theme);
    } catch (e) {}
  })();
</script>

{%- if page.url == "/" -%}
<script>
  /* Boot-Splash-Entscheider — siehe EFFEKTE.md. Läuft vor dem ersten Paint,
     nur auf der Startseite: 1-zu-5-Wurf, pro Browser-Session höchstens
     einmal, Reduced-Motion wird respektiert. Bei Treffer setzt es
     html.splash-active — effects.js übernimmt dann die Animation. */
  (function() {
    try {
      if (window.matchMedia &&
          window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
      if (sessionStorage.getItem('os79:splash')) return;
      if (Math.random() < 0.2) {
        sessionStorage.setItem('os79:splash', '1');
        document.documentElement.classList.add('splash-active');
      }
    } catch (e) {}
  })();
</script>
{%- endif -%}

{%- seo title=false -%}
